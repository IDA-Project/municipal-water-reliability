[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "municipal-water-reliability"
version = "0.1.0"
description = "Reproducible preparation workflow for WSA-level water reliability classification"
requires-python = ">=3.10"
dependencies = [
  "imbalanced-learn>=0.13,<1",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
water-reliability-q2 = "water_reliability.workflow:main"
water-reliability-q3 = "water_reliability.train_models:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
